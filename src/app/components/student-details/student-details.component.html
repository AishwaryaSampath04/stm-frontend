<div class="container-fluid mt-4">

    <div class="card stm-card shadow-lg border-0">

        <div class="card-header stm-header">

            <div class="d-flex align-items-center">

                <div class="header-line"></div>

                <div class="ms-3">

                    <h5 class="mb-0 fw-semibold">
                        High School Student Master
                    </h5>

                    <small>
                        View & Edit Student Details
                    </small>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table stm-table align-middle">

                    <thead>

                        <tr>

                            <th width="20%">
                                Admission No
                            </th>

                            <th width="45%">
                                Student Name
                            </th>

                            <th width="20%">
                                Grade
                            </th>

                            <th
                                width="15%"
                                class="text-center">

                                Action

                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let s of students">

                            <td>

                                {{ s.admission_no }}

                            </td>

                            <td>

                                <strong>

                                    {{ s.student_name }}

                                </strong>

                            </td>

                            <td>

                                <span class="badge bg-success">

                                    {{ s.grade_name }}

                                </span>

                            </td>

                            <td class="text-center">

                                <button
                                    class="btn stm-edit-btn"
                                    (click)="editStudent(s)">

                                    <i class="bi bi-pencil-square"></i>

                                    Edit

                                </button>

                            </td>

                        </tr>

                        <tr *ngIf="students.length==0">

                            <td
                                colspan="4"
                                class="text-center py-4">

                                No Student Records Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
        <!-- ================= EDIT STUDENT POPUP ================= -->

        <div
            class="stm-popup-overlay"
            *ngIf="showEditPopup">

            <div class="stm-popup">

                <!-- Header -->

                <div class="stm-header">

                    <div
                        class="d-flex justify-content-between align-items-center">

                        <div class="d-flex align-items-center">

                            <div class="header-line"></div>

                            <div class="ms-3">

                                <h5 class="mb-0 fw-semibold">

                                    Edit Student

                                </h5>

                                <small>

                                    Update Student Information

                                </small>

                            </div>

                        </div>

                        <button
                            class="stm-close-btn"
                            (click)="closePopup()">

                            <i class="bi bi-x-lg"></i>

                        </button>

                    </div>

                </div>

                <!-- Body -->

                <div class="card-body">

                    <!-- Row 1 -->

                    <div class="row g-3">

                        <div class="col-md-4">

                            <label class="form-label">

                                Admission No

                            </label>

                            <input
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.admission_no">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Student Name

                            </label>

                            <input
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.student_name">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Parent Name

                            </label>

                            <input
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.parent_name">

                        </div>

                    </div>

                    <!-- Row 2 -->

                    <div class="row g-3 mt-2">

                        <div class="col-md-4">

                            <label class="form-label">

                                Mobile No

                            </label>

                            <input
                                class="form-control stm-control"
                                maxlength="10"
                                [(ngModel)]="selectedStudent.mobile_no">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Grade

                            </label>

                            <select
                                class="form-select stm-control"
                                [(ngModel)]="selectedStudent.grade_id">

                                <option
                                    *ngFor="let grade of grades"
                                    [value]="grade.grade_id">

                                    {{ grade.grade_name }}

                                </option>

                            </select>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Annual Fee (₹)

                            </label>

                            <input
                                type="number"
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.annual_fee"
                                (input)="calculateFinalFee()">

                        </div>

                    </div>

                    <!-- Row 3 -->

                    <div class="row g-3 mt-2">

                        <div class="col-md-4">

                            <label class="form-label">

                                Discount (₹)

                            </label>

                            <input
                                type="number"
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.discount_amount"
                                (input)="calculateFinalFee()">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Final Fee (₹)

                            </label>

                            <input
                                readonly
                                class="form-control stm-control fee-readonly"
                                [(ngModel)]="selectedStudent.final_fee">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Status

                            </label>

                            <select
                                class="form-select stm-control"
                                [(ngModel)]="selectedStudent.active_flag">

                                <option value="Y">

                                    Active

                                </option>

                                <option value="N">

                                    Inactive

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- Row 4 -->

                    <div class="row g-3 mt-2">

                        <div class="col-md-6">

                            <label class="form-label">

                                Joining Date

                            </label>

                            <input
                                type="date"
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.joining_date">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Leaving Date

                            </label>

                            <input
                                type="date"
                                class="form-control stm-control"
                                [(ngModel)]="selectedStudent.leaving_date">

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div class="text-center mt-5">

                        <button
                            class="btn stm-save-btn px-5 me-3"
                            (click)="confirmUpdateStudent()"
                            [disabled]="
        !selectedStudent.admission_no ||
        !selectedStudent.student_name ||
        !selectedStudent.parent_name ||
        !selectedStudent.mobile_no ||
        !selectedStudent.grade_id ||
        selectedStudent.annual_fee == null ||
        selectedStudent.discount_amount == null ||
        selectedStudent.final_fee == null ||
        !selectedStudent.active_flag ||
        !selectedStudent.joining_date
    ">

                            <i class="bi bi-check-circle-fill me-2"></i>
                            Update Student
                        </button>
                        <button
                            class="btn stm-save-btn px-5 me-3"
                            (click)="closePopup()">

                            <i class="bi bi-check-circle-fill me-2"></i>

                            Cancel

                        </button>

                    </div>

                </div>

            </div>
        </div>

    </div>
